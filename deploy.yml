name: Deploy to on-prem server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Copies the repo to the server. Needs these GitHub repo secrets
      # set first (Settings -> Secrets and variables -> Actions):
      #   SSH_HOST, SSH_USER, SSH_PRIVATE_KEY
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/opt/posnack-ai-portal"

      - name: Rebuild and restart containers
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/posnack-ai-portal
            docker compose down
            docker compose up -d --build

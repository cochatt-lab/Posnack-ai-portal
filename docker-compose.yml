version: '3.9'
services:
  backend:
    build: ./backend
    env_file: .env
    volumes:
      - ./secrets:/run/secrets:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file: .env
    depends_on:
      - backend
    restart: unless-stopped

  # Reverse proxy — Caddy auto-provisions HTTPS certs for a real domain.
  # Swap for nginx if IT already manages certs a different way.
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
